<!doctype html>
<html lang="en-us">
  <head>
      <title>Course Authoring | <%= process.env.SITE_NAME %></title>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="shortcut icon" href="<%=htmlWebpackPlugin.options.FAVICON_URL%>" type="image/x-icon" />
  </head>
  <body>
    <div id="root"></div>
  </body>
<script>
(function () {

  const translations = {
    "Drag and drop your file here or click to upload.":
      "Arrastra y suelta tu archivo aquí o haz clic para subirlo.",

    "Upload TARGZ files":
      "Sube archivos TARGZ"
  };

  function translateDropzone() {
    const dropzones = document.querySelectorAll('[data-testid="dropzone"]');

    dropzones.forEach((dz) => {

      // 🔹 Traduce TODOS los <p>
      dz.querySelectorAll('p').forEach(p => {
        const text = p.textContent?.trim();

        if (translations[text]) {
          p.textContent = translations[text];
        }
      });

    });
  }

  document.addEventListener('DOMContentLoaded', translateDropzone);

  const observer = new MutationObserver(() => {
    translateDropzone();
  });

  observer.observe(document.body, {
    childList: true,
    subtree: true
  });

})();
</script>
</html>
